[project]
name = "fraud-engine"
version = "0.1.0"
description = "Cost-weighted fraud decisioning on the IEEE-CIS dataset"
readme = "README.md"
authors = [
    { name = "Bruno", email = "brunolima674@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.15.2",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.uv]
# cryptography stopped shipping macOS x86_64 wheels after 46.0.3, and this is an
# Intel Mac. Without the ceiling it is built from source, which needs OpenSSL
# headers that are not here. A constraint rather than a dependency: the project
# never imports cryptography, it only arrives under mlflow-skinny via
# databricks-sdk, so this bounds a transitive package without claiming to use it.
constraint-dependencies = ["cryptography<=46.0.3"]

[tool.ruff]
line-length = 100
# Tells isort which imports are yours vs third-party, so `fraud_engine`
# sorts into its own block instead of being mistaken for a PyPI package.
src = ["src", "tests"]
# No target-version needed: ruff reads requires-python (>=3.12) above and
# infers which modernisations are safe.

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle — whitespace and formatting basics
    "F",       # pyflakes — unused imports, undefined names. Pure bug-catching.
    "I",       # isort — deterministic import order, so diffs stay small
    "B",       # bugbear — mutable default args, loop-variable closures.
               #   Real bugs, not style. The single highest-value family here.
    "UP",      # pyupgrade — rewrites to modern idioms as 3.12 allows
    "C4",      # comprehensions — flags list(...)/dict(...) that should be literals
    "SIM",     # simplify — collapses redundant branches and context managers
    "PTH",     # use pathlib instead of os.path. A pipeline is mostly path
               #   plumbing; one Path API beats string concatenation everywhere.
    "PD",      # pandas-vet — inplace=True, chained assignment, .values vs
               #   .to_numpy(). Directly relevant to every file you're about to write.
    "NPY",     # numpy-specific legacy API usage
    "ARG",     # unused function arguments — usually a sign of a stale signature
    "RUF",     # ruff's own rules (mutable class defaults, unused noqa, etc.)
]
ignore = [
    "E501",    # line length. The formatter already enforces it; leaving the lint
               #   rule on means fighting it over long strings and comments.
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately take fixtures they never reference by name.
"tests/**" = ["ARG"]
# EDA notebooks: imports mid-file and stray prints are the point of a notebook.
# These stay linted rather than excluded, so genuine errors still surface.
"notebooks/**" = ["E402", "F401", "T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",              # summarise every non-passing result, not just failures
    "--strict-markers", # a typo'd @pytest.mark.slwo becomes an error, not a silent no-op
    "--strict-config",  # same for typos in this config block
]
# Deliberately no `pythonpath` setting. That is the src-layout payoff: tests
# import the installed package, not a directory that happens to be adjacent.
