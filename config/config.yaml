# ==============================================================================
# Pipeline configuration
# ==============================================================================
# Paths and stage parameters. Economic assumptions live in cost_matrix.yaml,
# versioned separately — see docs/problem-statement.md §4.
#
# NOTE: the paths below are also declared in the Makefile, which needs literal
# values to do mtime-based dependency resolution and cannot read this file.
# tests/test_config_paths.py asserts the two stay in step.
# ==============================================================================

paths:
  raw:
    transactions: data/raw/train_transaction.csv
    identity: data/raw/train_identity.csv
  interim: data/interim/transactions.parquet
  # One file, not four. A row carries one split label, so overlap between
  # splits is unrepresentable rather than merely untested.
  splits: data/splits/splits.parquet
  # Tracked, unlike data/ — the per-split counts are a Phase 02 deliverable and
  # the two E1 runs are compared table against table.
  split_summary: reports/metrics/split_summary.csv
  # Where evaluate() results land, one JSON per scored run. Tracked, so runs
  # stay comparable across phases and land in git history.
  metrics_dir: reports/metrics
  # The score vector behind each of those JSONs, one parquet per run. Derived
  # data, so gitignored — but written by the same call that writes the record,
  # so a figure drawn from it cannot disagree with the metrics it sits beside.
  # Carries only the splits the run actually scored; see report.DEFAULT_SPLITS.
  predictions_dir: data/predictions
  # The incumbent, fitted. Gitignored with the rest of models/ — derived, and
  # rebuilt by `make baselines` — but written rather than re-fitted, because the
  # fail-open path runs in a container with no training window to fit on and
  # fit() is the only function in rules.py that reads train. Carries the config
  # choices beside the fitted values: a served rule pairing current weights with
  # cut points fitted under the old ones would score plausibly and stop being
  # the incumbent the headline was measured against.
  rules_constants: models/rules.json
  # The measured spread of PR-AUC under meaningless columns — the bar a feature
  # family has to clear. Tracked: it is a decision input, not derived data.
  noise_floor: reports/metrics/noise_floor.csv
  # The fitted frequency tables. Gitignored with the rest of models/ — derived,
  # rebuilt by `make features` — but written rather than held in memory, because
  # "this family is servable from a static lookup" is a claim the file settles.
  encoders: models/encoders.parquet
  # Per-entity typical amount and spread. Same rationale as encoders above.
  amount_stats: models/amount_stats.parquet
  # Which V columns survived the reduction, and the medians they are filled with.
  vblock: models/vblock.parquet
  # How far one configuration moves when only the seed changes — the bar E6
  # judges a tuned candidate against. Tracked: a decision input, not derived
  # data, exactly like noise_floor.csv.
  seed_spread: reports/metrics/seed_spread.csv
  # E2's LightGBM arms, side by side. Tracked: the comparison is the deliverable,
  # and the point of the experiment is that the losing arms are reported too.
  imbalance: reports/metrics/imbalance.csv
  # E4's family deltas, re-measured under a tree by removal rather than by
  # addition. Tracked for the same reason: the comparison is the deliverable,
  # and the families that move nothing are as much the result as the one that
  # does.
  ablation: reports/metrics/ablation.csv
  # How far removing that many arbitrary columns moves the metric — the bar each
  # family delta is read against. Tracked: a decision input, exactly like
  # noise_floor.csv, and measured under the tree rather than under the probe.
  ablation_floor: reports/metrics/ablation_floor.csv
  # E1's three training windows, side by side. Tracked: the comparison is the
  # deliverable, and the purged arm is the shipped split rebuilt rather than
  # read, so all three rows come from one code path on one day.
  purge: reports/metrics/purge.csv
  # Where E1's arms build their own splits and matrices. Gitignored with the
  # rest of data/. Separate from the shipped pipeline on purpose: an arm that
  # wrote over the artifacts it is compared against would be measured against
  # itself, and nothing would look wrong.
  purge_dir: data/e1
  # The study, the winner, the confirmation runs and E6's verdict, in one
  # record. Tracked, and one file rather than three: a verdict separated from
  # the runs behind it is a claim without its evidence. mlruns/ is gitignored,
  # so the trial history would not survive a clone if it lived only there.
  tuning: reports/metrics/tuning.json
  # The trained booster, in LightGBM's own text format rather than a pickle:
  # unpickling executes code, and Phase 08 loads this file inside a served API.
  model: models/model.txt
  # The category vocabulary. Same rationale as encoders above — the booster
  # records which features are categorical and the codes its splits test, never
  # what those codes mean.
  categories: models/categories.parquet
  # The fill values, written only when model.impute is on. Same tier-2 role as
  # the vocabulary: a model trained on filled data is served wrong without them.
  medians: models/medians.parquet
  # Plain JSON, not a pickle: a Platt fit is two numbers and an isotonic fit a
  # list of breakpoints. Ships with the model — serving without it returns
  # uncalibrated probabilities and raises nothing.
  calibrator: models/calibrator.json
  # Both methods per fold, the rule and what it selected. Tracked: the
  # selection is a decision, and this is its evidence.
  calibration: reports/metrics/calibration.json
  # The four rows of decision-policy.md §4 on VAL-CAL, before the test touch.
  # Tracked: a model that does not beat the rules has to be found out here.
  rehearsal: reports/metrics/policy_val_cal.json
  # Every §4 row at every point of each one-at-a-time cost sweep, with a verdict
  # per assumption. Tracked: it is what the headline is stated with.
  sensitivity: reports/metrics/sensitivity_val_cal.json
  # E1's and E3's arms in USD on VAL-CAL, with a paired day-bootstrap interval on
  # each difference. Tracked: it closes what experiments.md records as owed.
  usd_halves: reports/metrics/usd_halves.json
  # The test touch: the four §4 rows, calibration and model metrics on test,
  # measured once. Tracked, and its existence is what stops a second touch.
  headline: reports/metrics/policy_test.json
  # One contributions parquet per explained split: a column per model feature,
  # plus the base value they are additive around. Gitignored with the rest of
  # data/ — derived, rebuildable, and far larger than the matrices it explains.
  explain_dir: data/explain
  # The global ranking and the share of contribution falling in each serving
  # tier. Tracked: docs/explainability.md section 4 is a deliverable, and the
  # tier shares are what the write-up is built on.
  shap_global: reports/metrics/shap_global.json
  # Scoring against explaining, one row at a time, with the machine attached.
  # Tracked, and the one record here whose numbers do not travel: it is true of
  # the hardware named inside it and of nothing else.
  explain_latency: reports/metrics/explain_latency.json
  # The sentences a declined customer is read. Versioned separately from this
  # file, like cost_matrix.yaml: editing text someone reads is not the same kind
  # of change as editing a threshold.
  reason_dictionary: config/reason_codes.yaml
  # How often a decline can be explained with anything but the generic. Tracked:
  # section 7's result, and the compliance-facing number of the phase.
  reason_codes: reports/metrics/reason_codes.json
  # What the tier-3 default costs on VAL-CAL, in PR-AUC and in USD. Tracked:
  # serving.md section 2 registers it as the price of not building the store,
  # and a serving default nobody priced is the thing that measurement prevents.
  neutralisation: reports/metrics/neutralisation.json
  # Figures are deliverables and live under the tracked reports/ tree.
  figures_dir: reports/figures
  # Economic assumptions, versioned separately. report.py reads the review
  # capacities from here so the sweep and the reports cannot diverge.
  cost_matrix: config/cost_matrix.yaml
  features_dir: data/features
  # One stamp per config section, so a stage restages when a section it reads
  # changes and not when any key anywhere does. See fraud_engine/config_stamps.py.
  config_stamps: data/config

# ------------------------------------------------------------------------------
# Phase 01 — load
# ------------------------------------------------------------------------------
load:
  # TransactionAmt is summed across hundreds of thousands of rows to produce the
  # headline USD figure, and float32 carries only ~7 significant digits, so
  # rounding error would accumulate in that sum. One column at double precision
  # costs nothing; the other 393 are downcast.
  amount_dtype: float64

  # Everything else numeric. float32 rather than an integer type even for the
  # count-like C* and day-delta D* families, because numpy integers cannot hold
  # NaN and this data is missing-heavy from the first row.
  default_float_dtype: float32

  # An object column becomes `category` when its distinct values are few
  # relative to row count. At 590,540 rows this ceiling is ~29,500 distinct
  # values; every string column in this dataset sits far below it (DeviceInfo is
  # widest at roughly two thousand). Pandas' own rule of thumb is 0.5 — this is
  # deliberately tighter.
  category_max_ratio: 0.05

  # Rows sampled to measure cardinality before the full typed read, so the file
  # is not parsed twice just to decide how to parse it.
  cardinality_sample_rows: 100000

# ------------------------------------------------------------------------------
# Phase 01 — EDA horizon
# ------------------------------------------------------------------------------
eda:
  # The last day the Phase 01 EDA was allowed to look at. `day` is 1-indexed in
  # this dataset (min TransactionDT is 86,400), so this is days 1–120 inclusive
  # of a 182-day span.
  #
  # This is not a preference. It is a record of what has already been seen, and
  # it binds Phase 02: every hypothesis in docs/hypotheses.md was formed against
  # these rows, so any boundary placed at or below this day sits inside data that
  # informed them. VAL-FIT, VAL-CAL and TEST must all begin after it.
  #
  # The cost of that is real and was accepted knowingly — days 121–182 is 62
  # days, which must hold the purge gap plus all three downstream slices. See
  # docs/problem-statement.md §7 item 5 for the arithmetic Phase 02 inherits.
  horizon_day: 120


# ------------------------------------------------------------------------------
# Phase 02 — Data split
# ------------------------------------------------------------------------------
splits:
  gap_days: 30
  train_start: 1
  val_fit_start: 121
  val_cal_start: 141
  test_start: 161
  test_end: 182

# ------------------------------------------------------------------------------
# Phase 03 — rules baseline (the incumbent)
# ------------------------------------------------------------------------------
# Weights are round(min(lift_half_A, lift_half_B)), measured on TRAIN days 1-90
# split at day 45. Never fitted or tuned against validation: an incumbent
# selected on the challenger's data makes the Phase 06 comparison meaningless.
# Evidence and provenance per rule: docs/rules-baseline.md.
#
# These are CHOICES. The values fitted from train — the per-product amount cut
# points and the amount ECDF — are computed by rules.fit() and never live here.
baselines:
  rules:
    round_amount:
      step: 50
      min: 150
      max: 500
      weight: 2

    # Not boolean: a lookup table of points per product. R and W score zero
    # because both sit below the base rate — that is "nothing added", not
    # evidence of safety.
    product_tier:
      C: 3
      S: 2
      H: 1
      R: 0
      W: 0

    amount_percentile:
      quantile: 0.99
      weight: 1

    new_card:
      d1_max: 3
      weight: 3

    w_m4_m2:
      weight: 1

    # Five integer-weighted rules emit a single-digit number of distinct scores,
    # so the daily capacity cut lands inside a tied block and row order decides
    # who gets reviewed. Breaking ties by amount aligns the incumbent with the
    # USD headline. Held below 1 so it can never outweigh a rule.
    amount_tiebreaker: 0.5

    # The tiebreaker needs an amount percentile for a SINGLE transaction at
    # serving time, so ranking within the batch is not available. The amount
    # distribution is fitted on train as a quantile grid of this many points.
    amount_ecdf_points: 1001

  # ----------------------------------------------------------------------------
  # Logistic regression — the "is the problem learnable, is complexity earning
  # its keep" reference point. Not the incumbent; that is the rules engine.
  # ----------------------------------------------------------------------------
  logistic:
    # Column families rather than hand-picked members: cherry-picking members is
    # itself a selection decision, and one nobody could later justify.
    #
    # Excluded on purpose: card1/2/3/5 and addr1/2 (high-cardinality identifiers
    # needing target encoding, which is Phase 04 and belongs inside CV folds);
    # V1-V339 (Phase 04 decides with evidence, not gut feel); dist1/dist2 and
    # R_emaildomain (>60% null); and `day` — the split axis, which would let the
    # model learn the timeline instead of fraud.
    d_max_null_frac: 0.50   # keeps D1, D3, D4, D10, D15 on train
    max_iter: 1000
    # No tuning happened here. C is the sklearn default, stated rather than
    # implied, because a baseline tuned against VAL-FIT stops being a reference
    # point and becomes a second model competing on the challenger's terms.
    C: 1.0

# ------------------------------------------------------------------------------
# Phase 04 — feature families
# ------------------------------------------------------------------------------
features:
  evaluation:
    # Runs of the probe on columns carrying no information whatsoever, to
    # measure how far chance alone moves PR-AUC. A family that beats the
    # baseline by less than this spread has demonstrated nothing. One fit is
    # ~26s, so this is the dominant cost of the stage — and it is paid once and
    # reused, not per family.
    noise_seeds: 20

    # The floor rises with width: more columns are more chances for the fit to
    # read signal into noise. A family is judged against a floor measured at its
    # own width, so this list grows as families arrive.
    #
    # 1 is the reference. 3 is the amount family.
    noise_widths: [1, 3]

  # ----------------------------------------------------------------------------
  # Amount transforms — the row-local family
  # ----------------------------------------------------------------------------
  # These restate H2 (docs/hypotheses.md), and are deliberately NOT shared with
  # baselines.rules.round_amount, which is the incumbent's own copy of the same
  # finding. One key for both would let retuning the rules engine silently move
  # the challenger's features.
  amounts:
    round_step: 50
    round_min: 150
    round_max: 500
    # H2 measures the effect concentrating here: $300 goes from 4.74x pooled to
    # 14.58x within this product. The interaction column is what lets a linear
    # probe see that at all.
    round_product: H

  # ----------------------------------------------------------------------------
  # Entity aggregates
  # ----------------------------------------------------------------------------
  aggregations:
    # Shrinkage strength k, in transactions: a per-entity mean and spread backed
    # by k observations counts equally with the training window's own. At k=10 a
    # card seen once is scored almost entirely against the global distribution,
    # which is the honest answer for an entity nothing is known about, and a card
    # seen hundreds of times is scored against itself.
    #
    # Not tuned. Tuning it against VAL-FIT would make the family a small fitted
    # model rather than a feature.
    prior_strength: 10

  # ----------------------------------------------------------------------------
  # Velocity — the only tier-3 family
  # ----------------------------------------------------------------------------
  velocity:
    # What "seconds since this card was last seen" means for a card never seen
    # before. Not a null and not a flag: measured on train, a first sighting
    # carries 0.63x lift against the slowest quintile's 0.71x, so it belongs at
    # the slow end of the same scale. Longer than the widest window, so it can
    # never be confused with a real gap.
    first_seen_gap_days: 30

  # ----------------------------------------------------------------------------
  # V-block reduction
  # ----------------------------------------------------------------------------
  # The thresholds ARE the decision; the surviving column list is derived from
  # them on train. A frozen list of two hundred names here would record the
  # outcome without recording the reasoning, and could not be diffed usefully.
  vblock:
    # Two columns at or above this absolute correlation are treated as the same
    # variable and one is kept. 0.90 is the conventional line, chosen rather than
    # discovered — and the finding is that the block is far less redundant than
    # its reputation: a third of it goes, not four fifths.
    correlation_threshold: 0.90

    # Held higher for the presence flags. Several NaN groups share a source and
    # their flags are near-identical; a linear model pays for each copy. Above
    # this they collapse to one.
    presence_threshold: 0.95

    # The floor below which nothing is fitted, in rows. A presence flag needs this
    # many on its rarer side, and a column needs this many non-null training rows
    # to be kept — its median is imposed on every gap in it, and one drawn from a
    # handful of observations is noise. Matches the probe's own OneHotEncoder
    # min_frequency, which excludes rare levels for the same stated reason.
    min_observed_rows: 50

# ------------------------------------------------------------------------------
# Phase 05 — experiment tracking
# ------------------------------------------------------------------------------
tracking:
  # A directory, not a URI. MLflow 3 retired the file store, so the local
  # backend is now SQLite, and a sqlite: URI embeds an absolute path that has to
  # be resolved anyway. Pointing this at a tracking server would change
  # authentication and artifact proxying too, so one key was never going to
  # cover it.
  #
  # Gitignored: a store, not a deliverable. The deliverables are the tracked
  # JSONs in reports/metrics/, and every run writes both.
  store: mlruns

  # One experiment for the project, one run per training attempt. Splitting by
  # phase would put the runs the comparison view exists to compare into separate
  # tables.
  experiment_name: fraud-decision-engine

# ------------------------------------------------------------------------------
# Phase 05 — LightGBM
# ------------------------------------------------------------------------------
model:
  # Occurrences in train below which a category level is not learned separately.
  # A tree splitting on a level backed by three transactions has memorised three
  # transactions. 50 matches the logistic probe's OneHotEncoder min_frequency
  # and the V-block's min_observed_rows, so "too rare to fit" means one thing
  # across the project.
  min_category_rows: 50

  # Fill numeric nulls with the training medians before fitting. Not a LightGBM
  # parameter, so not under `tuned` — it would be passed to a library that
  # discards unknown keys with a warning, and every run would train on raw data
  # while the config said otherwise.
  #
  # On because the configuration E6 accepted was measured with it on. E2 found
  # imputation helps and deliberately left the choice to the search rather than
  # settling it early, since the mechanism proposed for why it helps is
  # regularisation and the search moves two other regularisers.
  impute: true

  # A ceiling, not a target: early stopping decides how many trees there are.
  # One key, used by training and by the search alike. Two would have to agree,
  # and when they did not the confirmed candidate and the shipped model trained
  # under different budgets — measured at 606 to 2990 trees across seeds, which
  # a lower ceiling would have truncated into a different model wearing the same
  # parameters.
  num_boost_round: 5000

  # Rounds without improvement on VAL-FIT before stopping. Patience, not a
  # trigger — the metric curve is noisy and one worse round means nothing.
  early_stopping_rounds: 100

  # Fixed so a rerun reproduces. Step 4 varies it deliberately, to measure how
  # much of a difference between two configs is just the seed; nothing else may.
  seed: 0

  # Random column sets per width in the ablation floor. The widths themselves
  # are not here on purpose: they are the family sizes, read from the built
  # matrices, so no choice about them can be made after seeing a delta.
  floor_draws: 10

  # Where the seed spread is measured. Points, not one point: the untuned
  # reference has no seed sensitivity at all, because LightGBM's defaults sample
  # neither rows nor columns, so a bar taken there would be zero and would
  # describe nothing about the space the search explores.
  spread:
    seeds: 10
    points:
      # The reference itself. Expected to be identical across seeds — recorded
      # rather than assumed, since it is what makes the shipped run reproducible.
      untuned: {}

      # The conventional starting point for tuning a boosted model, and where
      # stochasticity enters at all.
      subsampled:
        feature_fraction: 0.8
        bagging_fraction: 0.8
        bagging_freq: 1

      # Deeper trees and heavier subsampling — the far corner of the space, where
      # the spread should be widest if it widens with either.
      aggressive:
        num_leaves: 127
        min_child_samples: 20
        feature_fraction: 0.6
        bagging_fraction: 0.6
        bagging_freq: 1

  # ----------------------------------------------------------------------------
  # Hyperparameter search
  # ----------------------------------------------------------------------------
  tune:
    # A compute budget, not an overfitting control. The winner's VAL-FIT score is
    # inflated by roughly the expected maximum of the seed spread over this many
    # draws, and that grows with the square root of the log of the count — thirty
    # trials to two hundred barely moves it. What removes the bias is E6's re-run.
    trials: 60

    # Inclusive bounds. Which knobs are integers and which are log-scaled is a
    # property of the parameter and lives in tune.py; only the ranges are choices.
    space:
      num_leaves: [15, 255]
      min_child_samples: [20, 500]

      # Floored at 0.03, and the floor is set by early_stopping_rounds rather
      # than by compute. Measured: a smaller step flattens the validation curve,
      # and a fixed patience closes on a flat curve *sooner* — the opposite of
      # the usual assumption that low rates need more rounds. Below this the
      # patience would be stopping trials that were still improving, and nothing
      # here could tell that apart from convergence.
      learning_rate: [0.03, 0.15]

      feature_fraction: [0.4, 1.0]
      bagging_fraction: [0.4, 1.0]
      min_data_per_group: [50, 500]
      cat_smooth: [1.0, 100.0]

  # The knobs tuning is allowed to move, merged over the contract parameters
  # fixed in train.py. These are what the study found and E6 accepted by a
  # factor of eight; reports/metrics/tuning.json carries the study behind them.
  #
  # min_child_samples sits on the floor of its search range and num_leaves four
  # from the ceiling: the search wanted a larger, less constrained model than
  # the space allowed, so this is a corner of that space rather than an interior
  # optimum. Recorded in E6 and deliberately not chased — picking a wider range
  # after seeing where the search pressed is a second selection.
  tuned:
    num_leaves: 251
    min_child_samples: 20
    learning_rate: 0.04265909034706551
    feature_fraction: 0.8797919539043785
    bagging_fraction: 0.823993133977403
    bagging_freq: 1
    min_data_per_group: 68
    cat_smooth: 52.55527169883299

# ------------------------------------------------------------------------------
# Phase 06 — calibration
# ------------------------------------------------------------------------------
# Method, folds and selection rule are registered in docs/decision-policy.md §1.
calibration:
  # Contiguous blocks of VAL-CAL days. Must divide the slice's days evenly, or
  # one fold would be scored on less data than the others without saying so.
  n_folds: 4

  # Quantile bins for expected calibration error. At a 3% base rate, equal-width
  # bins would put nearly every transaction in the first one.
  ece_bins: 10

  # Keeps logit finite at a score of exactly 0 or 1. A numerical guard, not a
  # modelling choice: set below every score the booster produces, because a clip
  # that reached real scores would tie them and flatten the ranking it exists
  # to preserve.
  score_clip: 1.0e-15

# ------------------------------------------------------------------------------
# Phase 06 — the USD halves E1 and E3 owe
# ------------------------------------------------------------------------------
# Registered in docs/decision-policy.md §6.
usd_halves:
  # Resamples of VAL-CAL's twenty days, drawn with replacement and shared by an
  # arm and its reference, so the interval is on the paired difference.
  bootstrap_resamples: 2000

  # The central share of resampled differences reported. An interval containing
  # zero reads as "not shown to differ in USD".
  interval: 0.95

  # Fixed so the interval is a rerunnable number rather than a draw.
  seed: 0

# ------------------------------------------------------------------------------
# Phase 07 — explainability
# ------------------------------------------------------------------------------
# Registered in docs/explainability.md. Nothing here can move a decision: the
# model, the calibrator and the policy were frozen before this section existed.
explain:
  # VAL-CAL as well as test, because the second scoring pass is the whole cost of
  # a comparison nothing else in the project provides. A difference between them
  # is a decay signal recorded for Phase 09, never a reason to change a feature.
  splits: [val_cal, test]

  # One sample, serving the ranking and the beeswarm alike. The registration said
  # the ranking would be measured over every row; TreeSHAP on this booster turned
  # out to cost enough per row that whole splits are hours of compute, and the
  # amendment was made before any contribution existed rather than after reading
  # one. The tail of the ranking is not read at this width — the tier shares are
  # carried by the large contributors and do not depend on it.
  sample_rows: 10000

  # Fixed so the figure is a rerunnable object rather than a draw. Same value as
  # model.seed and usd_halves.seed: nothing here varies it deliberately.
  seed: 0

  # Contributors per reason code. Committed before the ranking existed, so it
  # cannot be widened later until one of them reads well.
  top_k: 3

# ------------------------------------------------------------------------------
# Phase 07 — what an explanation costs to serve
# ------------------------------------------------------------------------------
# Registered in docs/explainability.md section 8. Its own section rather than keys
# under `explain`: a stamp covers a whole section, so a latency knob living there
# would restage the contributions run, which is hours of compute for a question it
# does not touch.
explain_latency:
  # Single-row calls, timed. Serving scores one transaction at a time, so a batch
  # figure would describe a throughput the API never has.
  rows: 100

  # Made first and discarded. A cold first request is not a latency figure.
  warmup: 10

  # LightGBM spreads one prediction across every core it can see, so the number
  # means nothing without saying how many it had. Measured at what a container
  # plausibly gets rather than at a development machine's core count, which no
  # deployment inherits.
  threads: [1, 4]

  # Whose rows are timed. Measurement on test is unlimited; nothing here moves a
  # threshold, a parameter or a feature.
  split: test

# ------------------------------------------------------------------------------
# Phase 08 — serving
# ------------------------------------------------------------------------------
# Registered in docs/serving.md. Nothing here can move a decision: the model, the
# calibrator and the policy were frozen before this section existed. A value
# below changes what the service does when it cannot decide in time — never what
# it decides.
serving:
  # The p95 the request path holds itself to, from problem-statement.md §3.1.
  # Named here as well as there because the service enforces it rather than
  # merely being measured against it: past this, the transaction takes the rules
  # decision.
  #
  # Not a timeout on the booster. A LightGBM prediction cannot be interrupted
  # from inside the process, so the request returns on time and the scoring work
  # finishes unwatched — serving.md §4 states that rather than implying a
  # cancellation the library does not offer.
  budget_ms: 100

  # Threads per worker, and one is measured rather than conventional: a single
  # row gives LightGBM nothing to divide, and explainability.md §8 found more
  # threads made the identical call slower, replicated across two runs.
  # Concurrency comes from workers, not from threads.
  threads: 1

  # What the explanation endpoint holds itself to, and it is deliberately not the number
  # above. problem-statement.md §3.1 prices an authorisation; an adverse-action notice is
  # not one, and explainability.md §8 measured a contribution call at ~900 ms p95 on a
  # sixteen-core machine at one thread. This sits above that with room for the two cheap
  # predictions beside it, and a breach returns no explanation rather than a fabricated
  # one — there is no fallback for a sentence a customer is read.
  explain_budget_ms: 2000

  # Whether a model that cannot answer falls back to the rules engine. On, per
  # problem-statement.md §3.1: declining every transaction during a model outage
  # converts an availability incident into a total revenue outage, which is
  # almost always the worse failure. Off is for a test that wants the failure to
  # surface, never for a deployment.
  fail_open: true

# What the serving default in serving.md §2 costs, measured on VAL-CAL. Its own
# section rather than a key under `serving:`, so that re-measuring the price of
# not building the store does not restage the service that charges it.
neutralisation:
  # Resamples of VAL-CAL's twenty days, drawn with replacement and shared by both
  # arms, so the interval is on the paired difference. Same values as
  # usd_halves: the two differences are meant to be read beside each other.
  bootstrap_resamples: 2000

  # The central share of resampled differences reported. An interval containing
  # zero reads as "not shown to differ in USD".
  interval: 0.95

  # Fixed so the interval is a rerunnable number rather than a draw.
  seed: 0
