# ==============================================================================
# Pipeline configuration
# ==============================================================================
# Paths and stage parameters. Economic assumptions live in cost_matrix.yaml,
# versioned separately — see docs/problem-statement.md §4.
#
# NOTE: the paths below are also declared in the Makefile, which needs literal
# values to do mtime-based dependency resolution and cannot read this file.
# tests/test_config_paths.py asserts the two stay in step.
# ==============================================================================

paths:
  raw:
    transactions: data/raw/train_transaction.csv
    identity: data/raw/train_identity.csv
  interim: data/interim/transactions.parquet
  # One file, not four. A row carries one split label, so overlap between
  # splits is unrepresentable rather than merely untested.
  splits: data/splits/splits.parquet
  # Tracked, unlike data/ — the per-split counts are a Phase 02 deliverable and
  # the two E1 runs are compared table against table.
  split_summary: reports/metrics/split_summary.csv
  # Where evaluate() results land, one JSON per scored run. Tracked, so runs
  # stay comparable across phases and land in git history.
  metrics_dir: reports/metrics
  # The score vector behind each of those JSONs, one parquet per run. Derived
  # data, so gitignored — but written by the same call that writes the record,
  # so a figure drawn from it cannot disagree with the metrics it sits beside.
  # Carries only the splits the run actually scored; see report.DEFAULT_SPLITS.
  predictions_dir: data/predictions
  # The measured spread of PR-AUC under meaningless columns — the bar a feature
  # family has to clear. Tracked: it is a decision input, not derived data.
  noise_floor: reports/metrics/noise_floor.csv
  # The fitted frequency tables. Gitignored with the rest of models/ — derived,
  # rebuilt by `make features` — but written rather than held in memory, because
  # "this family is servable from a static lookup" is a claim the file settles.
  encoders: models/encoders.parquet
  # Per-entity typical amount and spread. Same rationale as encoders above.
  amount_stats: models/amount_stats.parquet
  # Which V columns survived the reduction, and the medians they are filled with.
  vblock: models/vblock.parquet
  # Figures are deliverables and live under the tracked reports/ tree.
  figures_dir: reports/figures
  # Economic assumptions, versioned separately. report.py reads the review
  # capacities from here so the sweep and the reports cannot diverge.
  cost_matrix: config/cost_matrix.yaml
  features_dir: data/features

# ------------------------------------------------------------------------------
# Phase 01 — load
# ------------------------------------------------------------------------------
load:
  # TransactionAmt is summed across hundreds of thousands of rows to produce the
  # headline USD figure, and float32 carries only ~7 significant digits, so
  # rounding error would accumulate in that sum. One column at double precision
  # costs nothing; the other 393 are downcast.
  amount_dtype: float64

  # Everything else numeric. float32 rather than an integer type even for the
  # count-like C* and day-delta D* families, because numpy integers cannot hold
  # NaN and this data is missing-heavy from the first row.
  default_float_dtype: float32

  # An object column becomes `category` when its distinct values are few
  # relative to row count. At 590,540 rows this ceiling is ~29,500 distinct
  # values; every string column in this dataset sits far below it (DeviceInfo is
  # widest at roughly two thousand). Pandas' own rule of thumb is 0.5 — this is
  # deliberately tighter.
  category_max_ratio: 0.05

  # Rows sampled to measure cardinality before the full typed read, so the file
  # is not parsed twice just to decide how to parse it.
  cardinality_sample_rows: 100000

# ------------------------------------------------------------------------------
# Phase 01 — EDA horizon
# ------------------------------------------------------------------------------
eda:
  # The last day the Phase 01 EDA was allowed to look at. `day` is 1-indexed in
  # this dataset (min TransactionDT is 86,400), so this is days 1–120 inclusive
  # of a 182-day span.
  #
  # This is not a preference. It is a record of what has already been seen, and
  # it binds Phase 02: every hypothesis in docs/hypotheses.md was formed against
  # these rows, so any boundary placed at or below this day sits inside data that
  # informed them. VAL-FIT, VAL-CAL and TEST must all begin after it.
  #
  # The cost of that is real and was accepted knowingly — days 121–182 is 62
  # days, which must hold the purge gap plus all three downstream slices. See
  # docs/problem-statement.md §7 item 5 for the arithmetic Phase 02 inherits.
  horizon_day: 120


# ------------------------------------------------------------------------------
# Phase 02 — Data split
# ------------------------------------------------------------------------------
splits:
  gap_days: 30
  train_start: 1
  val_fit_start: 121
  val_cal_start: 141
  test_start: 161
  test_end: 182

# ------------------------------------------------------------------------------
# Phase 03 — rules baseline (the incumbent)
# ------------------------------------------------------------------------------
# Weights are round(min(lift_half_A, lift_half_B)), measured on TRAIN days 1-90
# split at day 45. Never fitted or tuned against validation: an incumbent
# selected on the challenger's data makes the Phase 06 comparison meaningless.
# Evidence and provenance per rule: docs/rules-baseline.md.
#
# These are CHOICES. The values fitted from train — the per-product amount cut
# points and the amount ECDF — are computed by rules.fit() and never live here.
baselines:
  rules:
    round_amount:
      step: 50
      min: 150
      max: 500
      weight: 2

    # Not boolean: a lookup table of points per product. R and W score zero
    # because both sit below the base rate — that is "nothing added", not
    # evidence of safety.
    product_tier:
      C: 3
      S: 2
      H: 1
      R: 0
      W: 0

    amount_percentile:
      quantile: 0.99
      weight: 1

    new_card:
      d1_max: 3
      weight: 3

    w_m4_m2:
      weight: 1

    # Five integer-weighted rules emit a single-digit number of distinct scores,
    # so the daily capacity cut lands inside a tied block and row order decides
    # who gets reviewed. Breaking ties by amount aligns the incumbent with the
    # USD headline. Held below 1 so it can never outweigh a rule.
    amount_tiebreaker: 0.5

    # The tiebreaker needs an amount percentile for a SINGLE transaction at
    # serving time, so ranking within the batch is not available. The amount
    # distribution is fitted on train as a quantile grid of this many points.
    amount_ecdf_points: 1001

  # ----------------------------------------------------------------------------
  # Logistic regression — the "is the problem learnable, is complexity earning
  # its keep" reference point. Not the incumbent; that is the rules engine.
  # ----------------------------------------------------------------------------
  logistic:
    # Column families rather than hand-picked members: cherry-picking members is
    # itself a selection decision, and one nobody could later justify.
    #
    # Excluded on purpose: card1/2/3/5 and addr1/2 (high-cardinality identifiers
    # needing target encoding, which is Phase 04 and belongs inside CV folds);
    # V1-V339 (Phase 04 decides with evidence, not gut feel); dist1/dist2 and
    # R_emaildomain (>60% null); and `day` — the split axis, which would let the
    # model learn the timeline instead of fraud.
    d_max_null_frac: 0.50   # keeps D1, D3, D4, D10, D15 on train
    max_iter: 1000
    # No tuning happened here. C is the sklearn default, stated rather than
    # implied, because a baseline tuned against VAL-FIT stops being a reference
    # point and becomes a second model competing on the challenger's terms.
    C: 1.0

# ------------------------------------------------------------------------------
# Phase 04 — feature families
# ------------------------------------------------------------------------------
features:
  evaluation:
    # Runs of the probe on columns carrying no information whatsoever, to
    # measure how far chance alone moves PR-AUC. A family that beats the
    # baseline by less than this spread has demonstrated nothing. One fit is
    # ~26s, so this is the dominant cost of the stage — and it is paid once and
    # reused, not per family.
    noise_seeds: 20

    # The floor rises with width: more columns are more chances for the fit to
    # read signal into noise. A family is judged against a floor measured at its
    # own width, so this list grows as families arrive.
    #
    # 1 is the reference. 3 is the amount family.
    noise_widths: [1, 3]

  # ----------------------------------------------------------------------------
  # Amount transforms — the row-local family
  # ----------------------------------------------------------------------------
  # These restate H2 (docs/hypotheses.md), and are deliberately NOT shared with
  # baselines.rules.round_amount, which is the incumbent's own copy of the same
  # finding. One key for both would let retuning the rules engine silently move
  # the challenger's features.
  amounts:
    round_step: 50
    round_min: 150
    round_max: 500
    # H2 measures the effect concentrating here: $300 goes from 4.74x pooled to
    # 14.58x within this product. The interaction column is what lets a linear
    # probe see that at all.
    round_product: H

  # ----------------------------------------------------------------------------
  # Entity aggregates
  # ----------------------------------------------------------------------------
  aggregations:
    # Shrinkage strength k, in transactions: a per-entity mean and spread backed
    # by k observations counts equally with the training window's own. At k=10 a
    # card seen once is scored almost entirely against the global distribution,
    # which is the honest answer for an entity nothing is known about, and a card
    # seen hundreds of times is scored against itself.
    #
    # Not tuned. Tuning it against VAL-FIT would make the family a small fitted
    # model rather than a feature.
    prior_strength: 10

  # ----------------------------------------------------------------------------
  # Velocity — the only tier-3 family
  # ----------------------------------------------------------------------------
  velocity:
    # What "seconds since this card was last seen" means for a card never seen
    # before. Not a null and not a flag: measured on train, a first sighting
    # carries 0.63x lift against the slowest quintile's 0.71x, so it belongs at
    # the slow end of the same scale. Longer than the widest window, so it can
    # never be confused with a real gap.
    first_seen_gap_days: 30

  # ----------------------------------------------------------------------------
  # V-block reduction
  # ----------------------------------------------------------------------------
  # The thresholds ARE the decision; the surviving column list is derived from
  # them on train. A frozen list of two hundred names here would record the
  # outcome without recording the reasoning, and could not be diffed usefully.
  vblock:
    # Two columns at or above this absolute correlation are treated as the same
    # variable and one is kept. 0.90 is the conventional line, chosen rather than
    # discovered — and the finding is that the block is far less redundant than
    # its reputation: a third of it goes, not four fifths.
    correlation_threshold: 0.90

    # Held higher for the presence flags. Several NaN groups share a source and
    # their flags are near-identical; a linear model pays for each copy. Above
    # this they collapse to one.
    presence_threshold: 0.95

    # The floor below which nothing is fitted, in rows. A presence flag needs this
    # many on its rarer side, and a column needs this many non-null training rows
    # to be kept — its median is imposed on every gap in it, and one drawn from a
    # handful of observations is noise. Matches the probe's own OneHotEncoder
    # min_frequency, which excludes rare levels for the same stated reason.
    min_observed_rows: 50
