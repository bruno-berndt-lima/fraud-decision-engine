# ==============================================================================
# Pipeline configuration
# ==============================================================================
# Paths and stage parameters. Economic assumptions live in cost_matrix.yaml,
# versioned separately — see docs/problem-statement.md §4.
#
# NOTE: the paths below are also declared in the Makefile, which needs literal
# values to do mtime-based dependency resolution and cannot read this file.
# tests/test_config_paths.py asserts the two stay in step.
# ==============================================================================

paths:
  raw:
    transactions: data/raw/train_transaction.csv
    identity: data/raw/train_identity.csv
  interim: data/interim/transactions.parquet
  # One file, not four. A row carries one split label, so overlap between
  # splits is unrepresentable rather than merely untested.
  splits: data/splits/splits.parquet
  # Tracked, unlike data/ — the per-split counts are a Phase 02 deliverable and
  # the two E1 runs are compared table against table.
  split_summary: reports/metrics/split_summary.csv
  # Where evaluate() results land, one JSON per scored run. Tracked, so runs
  # stay comparable across phases and land in git history.
  metrics_dir: reports/metrics
  # Economic assumptions, versioned separately. report.py reads the review
  # capacities from here so the sweep and the reports cannot diverge.
  cost_matrix: config/cost_matrix.yaml
  features_dir: data/features

# ------------------------------------------------------------------------------
# Phase 01 — load
# ------------------------------------------------------------------------------
load:
  # TransactionAmt is summed across hundreds of thousands of rows to produce the
  # headline USD figure, and float32 carries only ~7 significant digits, so
  # rounding error would accumulate in that sum. One column at double precision
  # costs nothing; the other 393 are downcast.
  amount_dtype: float64

  # Everything else numeric. float32 rather than an integer type even for the
  # count-like C* and day-delta D* families, because numpy integers cannot hold
  # NaN and this data is missing-heavy from the first row.
  default_float_dtype: float32

  # An object column becomes `category` when its distinct values are few
  # relative to row count. At 590,540 rows this ceiling is ~29,500 distinct
  # values; every string column in this dataset sits far below it (DeviceInfo is
  # widest at roughly two thousand). Pandas' own rule of thumb is 0.5 — this is
  # deliberately tighter.
  category_max_ratio: 0.05

  # Rows sampled to measure cardinality before the full typed read, so the file
  # is not parsed twice just to decide how to parse it.
  cardinality_sample_rows: 100000

# ------------------------------------------------------------------------------
# Phase 01 — EDA horizon
# ------------------------------------------------------------------------------
eda:
  # The last day the Phase 01 EDA was allowed to look at. `day` is 1-indexed in
  # this dataset (min TransactionDT is 86,400), so this is days 1–120 inclusive
  # of a 182-day span.
  #
  # This is not a preference. It is a record of what has already been seen, and
  # it binds Phase 02: every hypothesis in docs/hypotheses.md was formed against
  # these rows, so any boundary placed at or below this day sits inside data that
  # informed them. VAL-FIT, VAL-CAL and TEST must all begin after it.
  #
  # The cost of that is real and was accepted knowingly — days 121–182 is 62
  # days, which must hold the purge gap plus all three downstream slices. See
  # docs/problem-statement.md §7 item 5 for the arithmetic Phase 02 inherits.
  horizon_day: 120


# ------------------------------------------------------------------------------
# Phase 02 — Data split
# ------------------------------------------------------------------------------
splits:
  gap_days: 30
  train_start: 1
  val_fit_start: 121
  val_cal_start: 141
  test_start: 161
  test_end: 182

# ------------------------------------------------------------------------------
# Phase 03 — rules baseline (the incumbent)
# ------------------------------------------------------------------------------
# Weights are round(min(lift_half_A, lift_half_B)), measured on TRAIN days 1-90
# split at day 45. Never fitted or tuned against validation: an incumbent
# selected on the challenger's data makes the Phase 06 comparison meaningless.
# Evidence and provenance per rule: docs/rules-baseline.md.
#
# These are CHOICES. The values fitted from train — the per-product amount cut
# points and the amount ECDF — are computed by rules.fit() and never live here.
baselines:
  rules:
    round_amount:
      step: 50
      min: 150
      max: 500
      weight: 2

    # Not boolean: a lookup table of points per product. R and W score zero
    # because both sit below the base rate — that is "nothing added", not
    # evidence of safety.
    product_tier:
      C: 3
      S: 2
      H: 1
      R: 0
      W: 0

    amount_percentile:
      quantile: 0.99
      weight: 1

    new_card:
      d1_max: 3
      weight: 3

    w_m4_m2:
      weight: 1

    # Five integer-weighted rules emit a single-digit number of distinct scores,
    # so the daily capacity cut lands inside a tied block and row order decides
    # who gets reviewed. Breaking ties by amount aligns the incumbent with the
    # USD headline. Held below 1 so it can never outweigh a rule.
    amount_tiebreaker: 0.5

    # The tiebreaker needs an amount percentile for a SINGLE transaction at
    # serving time, so ranking within the batch is not available. The amount
    # distribution is fitted on train as a quantile grid of this many points.
    amount_ecdf_points: 1001
